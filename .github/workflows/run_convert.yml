name: Generate Test Data (Excel to XML Zip)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Debug - List Repository Files
      run: |
        echo "=== Current working directory content ==="
        ls -la

    - name: Run Excel to XML Script
      run: |
        python 1exceltoxml.py

    - name: Upload Generated Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: converted-xml-zip-data
        path: FULL_SFS_ID_MAPPING_MK_*.zip
        retention-days: 7