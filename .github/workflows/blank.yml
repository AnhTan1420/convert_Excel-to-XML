name: Generate Test Data (Excel to XML Zip)

on:
  workflow_dispatch:

# Tự động cấu hình ép các Action chạy trên nền Node.js 24 để xóa sạch cảnh báo ẩn
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    # Bước bổ sung: Liệt kê file để kiểm tra xem bạn đã push đủ file lên chưa
    - name: Debug - List Files in Workspace
      run: |
        echo "=== Checking available files in GitHub Workspace ==="
        ls -la

    - name: Run Excel to XML Script
      run: |
        python excel_to_xml.py

    - name: Upload Generated Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: converted-xml-zip-data
        path: FULL_SFS_ID_MAPPING_MK_*.zip
        retention-days: 7